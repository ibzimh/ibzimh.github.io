# Sounds ("features"): each one is a question with a short set of answers. Every file in features/ is read.
# A list of entries, each starting with "- ". Fields:
#   id        lowercase letters, numbers, dashes. Used in findings.
#   name      the linguist's name for it.
#   scale     pair | change | options   (decides the question and the answers)
#     pair:    words: [cot, caught]       2 or 3 words. Answers: same, nearly, mixed, different
#     change:  from: car                  Answers: yes, mixed, no
#              to: cah
#     options: word: bath                 Answers: an option id, or mixed
#              options: [{id: short, label: "short, like trap"}, ...]   2 to 6 of them
#   about     one or two plain sentences. Required.
#   group     optional: mergers-and-splits | vowels | consonants | shifts
#   also      optional: other names, as a list (one name can be plain text)
#   examples  optional: extra example text
#   was       optional: old ids this sound used to have, so old rows still find it

- id: cot-caught
  name: cot–caught merger
  also: [LOT–THOUGHT merger]
  scale: pair
  words: [cot, caught]
  group: mergers-and-splits
  examples: [cot / caught, Don / dawn, stock / stalk]
  about: Whether "cot" and "caught" sound the same. Where they have merged, both words are said with one vowel.

- id: pin-pen
  name: pin–pen merger
  also: [merger before n and m]
  scale: pair
  words: [pin, pen]
  group: mergers-and-splits
  examples: [pin / pen, tin / ten, him / hem]
  about: Whether "pin" and "pen" sound the same. It happens before the sounds n and m, so "pin" and "pen" match but "pit" and "pet" stay apart.

- id: mary-marry-merry
  name: Mary–marry–merry merger
  also: [merger before r]
  scale: pair
  words: [Mary, marry, merry]
  group: mergers-and-splits
  examples: [Mary / marry / merry]
  about: Whether "Mary", "marry" and "merry" sound the same. Where they have merged, all three are said alike.

- id: horse-hoarse
  name: horse–hoarse merger
  also: [NORTH–FORCE merger]
  scale: pair
  words: [horse, hoarse]
  group: mergers-and-splits
  examples: [horse / hoarse, for / four, morning / mourning]
  about: Whether "horse" and "hoarse" sound the same. Where they have merged, both are said with the same vowel.

- id: northern-cities
  name: Northern Cities Shift
  also: [NCS]
  scale: change
  from: bat
  to: be-at
  group: shifts
  examples: ['"bat" glides toward "bee-at"', '"bus" sounds closer to "boss"']
  about: A chain of vowel changes around the Great Lakes. Several vowels have moved so that, for example, "bat" and "bus" sound different from elsewhere.

- id: southern-shift
  name: Southern Shift
  also: [Southern Vowel Shift]
  scale: change
  from: bed
  to: bay-ed
  group: shifts
  examples: ['"ride" with no glide', '"bed" with a glide']
  about: A set of vowel changes heard in the South. Some vowels lose their glide and others gain one.

- id: canadian-raising
  name: Canadian raising
  also: [PRICE and MOUTH raising]
  scale: pair
  words: [writer, rider]
  group: vowels
  examples: [writer / rider, lout / loud]
  about: The vowel in "price" and "mouth" starts higher in the mouth before sounds like t and p. So "writer" and "rider" sound different.

- id: dropping-r
  name: dropping r
  also: [non-rhoticity]
  scale: change
  from: car
  to: cah
  group: consonants
  examples: [car, park, water]
  about: Leaving out the r sound after a vowel, so "car" sounds like "cah". Where people say the r, the place is rhotic.
